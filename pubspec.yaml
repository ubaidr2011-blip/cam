name: lancam
description: LAN IP camera viewer with ONVIF discovery, PTZ and local recording (Android + macOS).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  path: ^1.9.0
  http: ^1.2.1
  xml: ^6.5.0
  crypto: ^3.0.3
  share_plus: ^10.1.4

flutter:
  uses-material-design: true
